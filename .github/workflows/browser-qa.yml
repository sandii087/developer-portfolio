name: Browser QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/browser-qa.cjs
      - .github/workflows/browser-qa.yml
permissions:
  contents: read
jobs:
  responsive-browser-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install optional browser test dependency
        run: npm install --no-save --package-lock=false playwright@1.58.2
      - name: Verify live portfolio
        run: node scripts/browser-qa.cjs
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-browser-qa
          path: browser-qa-results/
